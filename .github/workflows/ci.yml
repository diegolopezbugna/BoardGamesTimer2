name: iOS CI

on:
  pull_request:
    branches: [main, develop, master]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('BoardGamesTimer2/BoardGamesTimer2.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM packages
        run: xcodebuild -resolvePackageDependencies -project BoardGamesTimer2/BoardGamesTimer2.xcodeproj -scheme BoardGamesTimer2

      - name: Build
        run: |
          xcodebuild build \
            -project BoardGamesTimer2/BoardGamesTimer2.xcodeproj \
            -scheme BoardGamesTimer2 \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            | xcbeautify

      - name: Run tests
        run: |
          xcodebuild test \
            -project BoardGamesTimer2/BoardGamesTimer2.xcodeproj \
            -scheme BoardGamesTimer2 \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
